<header class="app-header">
  <div class="header-container">
    <!-- Brand / Logo -->
    <a routerLink="/" class="brand-logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1" />
          <circle cx="19" cy="21" r="1" />
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
        </svg>
      </div>
      <span class="logo-text">NG<span class="accent">Store</span></span>
    </a>

    <!-- Navigation Links -->
    <nav class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
      <!-- Products & Categories Dropdown -->
      <div class="nav-item dropdown">
        <a routerLink="/products" routerLinkActive="active" class="nav-link dropdown-toggle">
          Products
          <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </a>
        <div class="dropdown-menu">
          <a routerLink="/products" class="dropdown-item all-item">All Products</a>
          <div class="dropdown-divider"></div>
          <div class="dropdown-scroll">
            @for (cat of categories(); track cat.slug) {
            <a [routerLink]="['/products']" [queryParams]="{category: cat.slug}" class="dropdown-item">
              {{ cat.name }}
            </a>
            }
          </div>
        </div>
      </div>
      <a routerLink="/about" routerLinkActive="active" class="nav-link">About Us</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input #searchInput type="search" placeholder="Search products..." class="search-input"
          (keyup.enter)="onSearch(searchInput.value)" />
      </div>

      <button class="cart-btn" type="button" aria-label="Cart" (click)="cartService.toggleCart()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <span class="cart-badge">{{ cartService.totalItems() }}</span>
      </button>
    </div>
  </div>
</header>
