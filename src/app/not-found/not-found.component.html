<div class="not-found-wrapper">
  <!-- Subtle ambient background glowing shapes -->
  <div class="glow-orb glow-orb-1" aria-hidden="true"></div>
  <div class="glow-orb glow-orb-2" aria-hidden="true"></div>

  <div class="not-found-card">
    <div class="badge">
      <span class="badge-dot"></span>
      Error 404 • Page Not Found
    </div>

    <div class="illustration-container">
      <span class="number-ghost">404</span>
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="illustration-svg">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>
    </div>

    <h1 class="title">Looking for something?</h1>
    <p class="description">
      We couldn't find the product or page you're searching for. It might have been moved, renamed, or is temporarily unavailable.
    </p>

    <div class="actions">
      <a routerLink="/products" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
        Browse Products
      </a>

      <a routerLink="/" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home Page
      </a>

      <button (click)="goBack()" type="button" class="btn btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go Back
      </button>
    </div>

    <div class="quick-links">
      <span class="quick-links-label">Quick links:</span>
      <a routerLink="/products">Catalog</a>
      <span class="divider">•</span>
      <a routerLink="/about">About Us</a>
      <span class="divider">•</span>
      <a routerLink="/contact">Contact Support</a>
    </div>
  </div>
</div>
